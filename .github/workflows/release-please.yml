on:
  push:
    branches:
      - main

name: release-please

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      sdk_released: ${{ steps.release.outputs['packages/asc-sdk--release_created'] }}
      auth_released: ${{ steps.release.outputs['packages/asc-auth--release_created'] }}
    steps:
      # Same reason as update-spec.yml: release PRs opened by
      # github-actions[bot] have their `ci` runs held for manual approval.
      # Minting a bradfordbot[bot] token lets them run unattended.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.BRADFORDBOT_CLIENT_ID }}
          private-key: ${{ secrets.BRADFORDBOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run format -- --check
      - run: npm run lint
      - run: npm run type-check --workspaces --if-present
      - run: npm run build --workspaces --if-present
      - run: npm test --workspaces --if-present

      - name: Pack SDK tarball
        run: cd packages/asc-sdk && npm pack

      - name: Install tarball in smoke test
        run: cd smoke-test && npm install ../packages/asc-sdk/bradford-tech-asc-sdk-*.tgz

      - name: Smoke test (runtime)
        run: cd smoke-test && node test.mjs

      - name: Smoke test (types)
        run: cd smoke-test && npx tsc --noEmit

  publish:
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build --workspaces --if-present

      - run: npm publish --workspace packages/asc-sdk
        if: ${{ needs.release-please.outputs.sdk_released == 'true' }}

      - run: npm publish --workspace packages/asc-auth
        if: ${{ needs.release-please.outputs.auth_released == 'true' }}

      - name: Publish asc-sdk to JSR
        if: ${{ needs.release-please.outputs.sdk_released == 'true' }}
        continue-on-error: true
        run: cd packages/asc-sdk && npx jsr publish --allow-dirty

      - name: Publish asc-auth to JSR
        if: ${{ needs.release-please.outputs.auth_released == 'true' }}
        continue-on-error: true
        run: cd packages/asc-auth && npx jsr publish --allow-dirty
