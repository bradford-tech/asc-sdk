name: Update OpenAPI Spec

on:
  schedule:
    - cron: "0 9 * * *" # Every day at 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-spec
  cancel-in-progress: true

jobs:
  update-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Snapshot previous spec
        id: snapshot
        run: |
          if [ -f packages/asc-sdk/spec/openapi.oas.json ]; then
            cp packages/asc-sdk/spec/openapi.oas.json "$GITHUB_WORKSPACE/.previous-spec.json"
            echo "has_previous=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download latest spec
        run: |
          # Apple's CDN occasionally resets the TLS handshake (curl exit 35).
          # --retry alone does not retry connection-level errors, so
          # --retry-all-errors is required; -S keeps the diagnostic visible.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            -o /tmp/spec.zip "https://developer.apple.com/sample-code/app-store-connect/app-store-connect-openapi-specification.zip"
          rm -rf /tmp/spec-extract
          mkdir -p /tmp/spec-extract
          # Apple's archive filename is not stable (e.g. "openapi.oas (2).json"),
          # so extract whatever JSON it contains, ignoring macOS resource forks.
          unzip -o -j /tmp/spec.zip -x "__MACOSX/*" -d /tmp/spec-extract
          spec_file=$(find /tmp/spec-extract -maxdepth 1 -type f -name '*.json' | head -n1)
          if [ -z "$spec_file" ]; then
            echo "::error::No JSON spec file found in Apple's archive" >&2
            unzip -l /tmp/spec.zip >&2
            exit 1
          fi
          mkdir -p packages/asc-sdk/spec
          cp "$spec_file" packages/asc-sdk/spec/openapi.oas.json

      - name: Validate spec
        id: lint
        continue-on-error: true
        run: npx -y @redocly/cli@2.28.1 lint packages/asc-sdk/spec/openapi.oas.json --extends=spec --format=github-actions

      - name: Generate API changelog
        id: changelog
        if: steps.snapshot.outputs.has_previous == 'true'
        uses: oasdiff/oasdiff-action/changelog@9de38a0cce19e0c0ac89d7d760dc5c499fb8a2a7 # v0.0.42
        with:
          base: .previous-spec.json
          revision: packages/asc-sdk/spec/openapi.oas.json
          format: markdown
        continue-on-error: true

      - name: Detect breaking changes
        id: breaking
        if: steps.snapshot.outputs.has_previous == 'true'
        uses: oasdiff/oasdiff-action/breaking@9de38a0cce19e0c0ac89d7d760dc5c499fb8a2a7 # v0.0.42
        with:
          base: .previous-spec.json
          revision: packages/asc-sdk/spec/openapi.oas.json
        continue-on-error: true

      # CI rejects any PR whose committed src/client differs from a fresh
      # generation, so the regenerated SDK must ship in the same PR as the spec.
      - name: Regenerate SDK
        id: generate
        continue-on-error: true
        run: |
          # The snapshot is not prettier-ignored; drop it before `npm run fix`.
          rm -f "$GITHUB_WORKSPACE/.previous-spec.json"
          npm run generate

      - name: Detect SDK changes
        id: sdk
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          if [ "$GENERATE_OUTCOME" != "success" ]; then
            # `generate` wipes src/client before writing; never commit a partial tree.
            git checkout -- packages/asc-sdk/src/client
            git clean -fdq packages/asc-sdk/src/client
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git status --porcelain packages/asc-sdk/src/client)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR metadata
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          BREAKING: ${{ steps.breaking.outputs.breaking }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          SDK_CHANGED: ${{ steps.sdk.outputs.changed }}
        run: |
          # A `feat` commit makes release-please cut an SDK release; a spec-only
          # change (docs, descriptions) stays a `chore` and releases nothing.
          if [ "$SDK_CHANGED" = "true" ]; then
            echo 'PR_TITLE=feat(sdk): update SDK for App Store Connect OpenAPI spec changes' >> "$GITHUB_ENV"
          else
            echo 'PR_TITLE=chore(spec): update App Store Connect OpenAPI spec' >> "$GITHUB_ENV"
          fi

          {
            echo 'PR_BODY<<EOF_9f3a7b2c'
            echo 'The upstream App Store Connect OpenAPI specification has changed.'
            echo ''
            echo 'This PR updates `packages/asc-sdk/spec/openapi.oas.json` to the latest version.'
            echo ''
            if [ "$LINT_OUTCOME" = "success" ]; then
              echo '**Spec validation:** Passed'
            else
              echo '**Spec validation:** Failed — review lint output in the [workflow run](https://github.com/bradford-tech/asc-sdk/actions).'
            fi
            echo ''
            if [ "$GENERATE_OUTCOME" != "success" ]; then
              echo '**SDK regeneration:** Failed — run `npm run generate` locally, fix the generator, and push to this branch. CI will fail until the SDK is regenerated.'
            elif [ "$SDK_CHANGED" = "true" ]; then
              echo '**SDK regeneration:** `packages/asc-sdk/src/client` regenerated and included in this PR.'
            else
              echo '**SDK regeneration:** No changes to generated code.'
            fi
            if [ -n "$BREAKING" ]; then
              echo ''
              echo '## ⚠️ Breaking changes detected'
              echo ''
              printf '%s\n' "$BREAKING"
              echo ''
              echo 'Consider a major version bump on the next SDK release.'
            fi
            if [ -n "$CHANGELOG" ]; then
              echo ''
              echo '<details><summary>Full API changelog</summary>'
              echo ''
              printf '%s\n' "$CHANGELOG"
              echo ''
              echo '</details>'
            fi
            echo 'EOF_9f3a7b2c'
          } >> "$GITHUB_ENV"

          if [ -n "$BREAKING" ]; then
            printf 'PR_LABELS<<LABELS_EOF\nautomated\nbreaking-change\nLABELS_EOF\n' >> "$GITHUB_ENV"
          else
            echo 'PR_LABELS=automated' >> "$GITHUB_ENV"
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: ${{ env.PR_TITLE }}
          title: ${{ env.PR_TITLE }}
          body: ${{ env.PR_BODY }}
          branch: update-openapi-spec
          delete-branch: true
          add-paths: |
            packages/asc-sdk/spec/openapi.oas.json
            packages/asc-sdk/src/client
          labels: ${{ env.PR_LABELS }}
          assignees: sbs44
          reviewers: sbs44
          sign-commits: true
